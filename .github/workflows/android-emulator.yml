name: Android emulator acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-emulator.yml"
      - "examples/ci-emulator/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - ".github/workflows/android-emulator.yml"
      - "examples/ci-emulator/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-run:
    name: Finite run (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install and build ADB Ready
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run one bounded ADB Ready verification
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-port: 5554
          emulator-boot-timeout: 600
          disable-animations: true
          script: >-
            mkdir -p .adb-ready &&
            node dist/cli.js run
            --config examples/ci-emulator/adb-ready.config.json
            --device emulator-5554
            --run-timeout 2m
            --format ndjson
            --non-interactive
            -- node examples/ci-emulator/verify-emulator.mjs
            > .adb-ready/ci-result.ndjson

      - name: Preserve normalized result and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adb-ready-emulator-evidence
          path: |
            .adb-ready/ci-result.ndjson
            .adb-ready/artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
