name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, or publish the prepared draft release
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish
      release_tag:
        description: Exact release tag matching package.json
        required: true
        type: string
      ref:
        description: Git ref to validate; publish mode requires the release tag
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Confirm prepared draft release
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write # Inspect a draft release without checking out or running repository code.

    steps:
      - name: Require a matching draft GitHub release for publish mode
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          test "$release_is_draft" = "true"

  validate:
    name: Validate npm release artifact
    needs: release-preflight
    if: always() && (inputs.mode == 'validate' || needs.release-preflight.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Check out the requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js without publish credentials
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up the pinned pnpm consumer
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        env:
          # This job intentionally tests pnpm as a consumer of this Bun-managed project.
          PNPM_CONFIG_PM_ON_FAIL: ignore
        with:
          version: 12.3.4
          cache: false
          install: false

      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Deno 2
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install the locked toolchain
        run: bun install --frozen-lockfile

      - name: Run the complete verification gate
        env:
          ADB_READY_REQUIRE_PACKAGE_MANAGERS: npm,pnpm,yarn,bun
          ADB_READY_YARN_CLI: ${{ github.workspace }}/node_modules/yarn/bin/yarn.js
        run: bun run verify

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun run release:check -- --publish "$RELEASE_TAG"

      - name: Require an immutable release target for publish mode
        if: inputs.mode == 'publish'
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = "$RELEASE_TAG"
          if [ "$WORKFLOW_REF" != "refs/heads/main" ] && [ "$WORKFLOW_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Publish must be dispatched from protected main or the matching release tag."
            exit 1
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

      - name: Create the immutable npm artifact
        id: package
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/adb-ready-release
        run: bun run pack:release -- --output "$ARTIFACT_DIRECTORY"

      - name: Test the exact artifact with required package managers
        env:
          ADB_READY_REQUIRE_PACKAGE_MANAGERS: npm,pnpm,yarn,bun
          ADB_READY_YARN_CLI: ${{ github.workspace }}/node_modules/yarn/bin/yarn.js
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: bun run scripts/package-manager-smoke.mjs --tarball "$RELEASE_TARBALL"

      - name: Test the exact artifact with modern Yarn
        env:
          ADB_READY_YARN_CLI: ${{ github.workspace }}/node_modules/@yarnpkg/cli-dist/bin/yarn.js
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          node "$ADB_READY_YARN_CLI" --version
          ADB_READY_REQUIRE_PACKAGE_MANAGERS=yarn bun run scripts/package-manager-smoke.mjs --tarball "$RELEASE_TARBALL"

      - name: Rehearse the registry publication
        env:
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: bun run npm publish "$RELEASE_TARBALL" --access public --dry-run

      - name: Preserve the verified artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifact to npm
    if: inputs.mode == 'publish'
    needs:
      - release-preflight
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Exchange the workflow identity for a short-lived npm publish token.

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/adb-ready-release

      - name: Verify the promoted artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.artifact-sha256 }}
          RELEASE_TARBALL: ${{ runner.temp }}/adb-ready-release/adb-ready.tgz
        run: test "$(sha256sum "$RELEASE_TARBALL" | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"

      - name: Publish with npm trusted publishing
        env:
          RELEASE_TARBALL: ${{ runner.temp }}/adb-ready-release/adb-ready.tgz
        run: npm publish "$RELEASE_TARBALL" --access public

  registry-verification:
    name: Verify the public npm release
    if: inputs.mode == 'publish'
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up Node.js without publish credentials
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up the pinned pnpm consumer
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        env:
          PNPM_CONFIG_PM_ON_FAIL: ignore
        with:
          version: 12.3.4
          cache: false
          install: false

      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Deno 2
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install the locked verification toolchain
        run: bun install --frozen-lockfile

      - name: Wait for the exact public registry version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in {1..30}; do
            observed=$(npm view "adb-ready@$version" version 2>/dev/null || true)
            if [ "$observed" = "$version" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::adb-ready@$version did not become readable from the public npm registry within 5 minutes."
              exit 1
            fi
            sleep 10
          done

      - name: Verify the public tarball digest
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.artifact-sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          destination="$RUNNER_TEMP/public-package"
          mkdir -p "$destination"
          npm pack "adb-ready@$version" --ignore-scripts --pack-destination "$destination"
          actual=$(sha256sum "$destination/adb-ready-$version.tgz" | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_SHA256"

      - name: Install and run the public package with required package managers
        env:
          ADB_READY_REQUIRE_PACKAGE_MANAGERS: npm,pnpm,yarn,bun
          ADB_READY_YARN_CLI: ${{ github.workspace }}/node_modules/yarn/bin/yarn.js
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun run scripts/package-manager-smoke.mjs --package "adb-ready@${RELEASE_TAG#v}"

      - name: Install and run the public package with modern Yarn
        env:
          ADB_READY_REQUIRE_PACKAGE_MANAGERS: yarn
          ADB_READY_YARN_CLI: ${{ github.workspace }}/node_modules/@yarnpkg/cli-dist/bin/yarn.js
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun run scripts/package-manager-smoke.mjs --package "adb-ready@${RELEASE_TAG#v}"

      - name: Run the public package with Deno
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(deno run -A --minimum-dependency-age 0 "npm:adb-ready@$version" --version)" = "$version"

  github-release:
    name: Publish the prepared GitHub release
    if: inputs.mode == 'publish'
    needs: registry-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Publish the prepared draft only after public-registry verification succeeds.

    steps:
      - name: Publish the draft after public-registry verification succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
