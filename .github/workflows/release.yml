name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish to npm
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@v2

      - name: Install the locked toolchain
        run: bun install --frozen-lockfile

      - name: Pin a trusted-publishing capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Run the complete verification gate
        run: bun run verify

      - name: Validate release metadata and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun run release:check -- --publish "$RELEASE_TAG"

      - name: Publish with npm trusted publishing
        run: npm publish --access public
