name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
          version: v1.30.1

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up the pinned pnpm consumer
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env:
          # This job intentionally tests pnpm as a consumer of this Bun-managed project.
          PNPM_CONFIG_PM_ON_FAIL: ignore
        with:
          version: 12.3.4
          cache: false
          install: false

      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Deno 2
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run authoritative verification
        env:
          ADB_READY_REQUIRE_PACKAGE_MANAGERS: npm,pnpm,yarn,bun
          ADB_READY_YARN_CLI: ${{ github.workspace }}/node_modules/yarn/bin/yarn.js
          # Reproduce setup-node's publish config without exposing a credential.
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/tests/fixtures/setup-node-auth.npmrc
        run: bun run verify

  node-compatibility:
    name: Node.js ${{ matrix.node }} artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build portable artifact
        run: bun run build

      - name: Execute with Node.js ${{ matrix.node }}
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
