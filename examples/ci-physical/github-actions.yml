name: Physical Android acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

# Queue jobs at GitHub's runner boundary. ADB Ready's host-local lease remains
# the final authority when another local process uses the same target.
concurrency:
  group: physical-android-device
  cancel-in-progress: false

jobs:
  finite-run:
    name: Target-bound physical run
    runs-on: [self-hosted, android-device]
    timeout-minutes: 20
    env:
      ADB_READY_DEVICE_SERIAL: ${{ vars.ADB_READY_DEVICE_SERIAL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install and build ADB Ready
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run one bounded physical-device verification
        run: node examples/ci-physical/run-job.mjs

      - name: Preserve normalized result and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adb-ready-physical-evidence
          path: |
            .adb-ready/ci-result.ndjson
            .adb-ready/artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
